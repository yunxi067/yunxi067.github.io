<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Agent 开发和传统 Java 开发的流程对比</title>
  <desc id="desc">左侧展示传统 Java 开发从需求到上线的确定性流程，右侧展示 Agent 开发围绕目标、上下文、工具和反馈回路展开。</desc>
  <rect width="1120" height="560" rx="28" fill="#fffdf7"/>
  <rect x="32" y="32" width="1056" height="496" rx="22" fill="#f7f4ed" stroke="#ded7c8" stroke-width="2"/>

  <text x="72" y="86" fill="#20201d" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="28" font-weight="800">开发流程：确定路径 vs 动态编排</text>
  <text x="72" y="122" fill="#68645c" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17">Java 更像设计一条稳定流水线；Agent 更像设计一个带反馈的工作循环。</text>

  <line x1="560" y1="154" x2="560" y2="478" stroke="#ded7c8" stroke-width="2" stroke-dasharray="8 10"/>

  <text x="106" y="180" fill="#2f6f5e" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="800">传统 Java 开发</text>
  <text x="636" y="180" fill="#b85c38" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="800">Agent 开发</text>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <g fill="#fffdf7" stroke="#2f6f5e" stroke-width="2">
      <rect x="90" y="216" width="140" height="58" rx="8"/>
      <rect x="270" y="216" width="140" height="58" rx="8"/>
      <rect x="450" y="216" width="70" height="58" rx="8"/>
      <rect x="180" y="346" width="140" height="58" rx="8"/>
      <rect x="360" y="346" width="140" height="58" rx="8"/>
    </g>
    <g fill="#20201d" font-size="17" font-weight="700" text-anchor="middle">
      <text x="160" y="251">需求分析</text>
      <text x="340" y="251">接口设计</text>
      <text x="485" y="251">编码</text>
      <text x="250" y="381">测试验证</text>
      <text x="430" y="381">发布运维</text>
    </g>
    <g stroke="#2f6f5e" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)">
      <path d="M230 245h34"/>
      <path d="M410 245h34"/>
      <path d="M485 274c0 46-65 46-145 72"/>
      <path d="M320 375h34"/>
    </g>

    <g fill="#fffdf7" stroke="#b85c38" stroke-width="2">
      <rect x="628" y="216" width="132" height="58" rx="8"/>
      <rect x="804" y="216" width="132" height="58" rx="8"/>
      <rect x="716" y="326" width="132" height="58" rx="8"/>
      <rect x="628" y="426" width="132" height="58" rx="8"/>
      <rect x="804" y="426" width="132" height="58" rx="8"/>
    </g>
    <g fill="#20201d" font-size="17" font-weight="700" text-anchor="middle">
      <text x="694" y="251">目标</text>
      <text x="870" y="251">上下文</text>
      <text x="782" y="361">工具调用</text>
      <text x="694" y="461">验证</text>
      <text x="870" y="461">反馈修正</text>
    </g>
    <g stroke="#b85c38" stroke-width="2.5" fill="none" marker-end="url(#arrow-warm)">
      <path d="M760 245h38"/>
      <path d="M870 274c0 42-44 42-66 52"/>
      <path d="M760 326c-48-26-66-26-66-52"/>
      <path d="M782 384c0 28-58 28-74 42"/>
      <path d="M760 455h38"/>
      <path d="M870 426c0-54-26-74-58-92"/>
    </g>
  </g>

  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f6f5e"/>
    </marker>
    <marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b85c38"/>
    </marker>
  </defs>
</svg>
