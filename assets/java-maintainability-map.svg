<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Java 可维护性地图</title>
  <desc id="desc">从边界、数据、事务、测试、可观测性五个维度说明 Java 项目的维护基本盘。</desc>
  <rect width="1280" height="720" rx="34" fill="#fbf7ed"/>
  <rect x="42" y="42" width="1196" height="636" rx="28" fill="#fffaf0" stroke="#d8cbb7" stroke-width="2"/>
  <text x="82" y="108" fill="#1d211c" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="34" font-weight="800">Java 项目的可维护性地图</text>
  <text x="82" y="148" fill="#6f746d" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18">越写越乱的根源通常不是技术栈，而是边界、数据流和变更成本失控。</text>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <circle cx="640" cy="375" r="92" fill="#14221b"/>
    <text x="640" y="365" fill="#fbf7ed" font-size="22" font-weight="800" text-anchor="middle">可维护性</text>
    <text x="640" y="398" fill="#d8cbb7" font-size="15" text-anchor="middle">让变更成本可预期</text>
    <g fill="#f7f4ed" stroke="#2f6f5e" stroke-width="2">
      <rect x="128" y="226" width="224" height="112" rx="12"/>
      <rect x="528" y="176" width="224" height="112" rx="12"/>
      <rect x="928" y="226" width="224" height="112" rx="12"/>
      <rect x="248" y="496" width="224" height="112" rx="12"/>
      <rect x="808" y="496" width="224" height="112" rx="12"/>
    </g>
    <g fill="#1d211c" font-size="21" font-weight="800" text-anchor="middle">
      <text x="240" y="272">模块边界</text>
      <text x="640" y="222">数据模型</text>
      <text x="1040" y="272">事务范围</text>
      <text x="360" y="542">测试策略</text>
      <text x="920" y="542">可观测性</text>
    </g>
    <g fill="#6f746d" font-size="15" text-anchor="middle">
      <text x="240" y="305">谁负责什么，谁不能越界</text>
      <text x="640" y="255">DTO、Entity、VO 不混用</text>
      <text x="1040" y="305">事务只包必要的业务一致性</text>
      <text x="360" y="575">单测守规则，集成测守链路</text>
      <text x="920" y="575">日志、指标、异常可定位</text>
    </g>
    <g stroke="#b8663b" stroke-width="3" fill="none">
      <path d="M352 298 C470 314 520 338 560 358"/>
      <path d="M640 288 L640 283"/>
      <path d="M928 298 C806 314 760 338 720 358"/>
      <path d="M472 530 C540 480 574 438 600 420"/>
      <path d="M808 530 C740 480 706 438 680 420"/>
    </g>
  </g>
</svg>
