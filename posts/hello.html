      <h1>第一篇：博客上线记录</h1>
      <p class="lead">
        这个博客从一个空的 GitHub Pages 仓库开始，使用纯静态文件发布，保持简单、稳定、容易维护。
      </p>

      <h2>为什么先用静态页面</h2>
      <p>
        首版目标不是搭复杂系统，而是先获得一个可以公开访问、可以持续记录的地方。纯 HTML 和 CSS 没有构建依赖，后续迁移到 Jekyll、Astro 或 VitePress 也很容易。
      </p>

      <h2>接下来可以写什么</h2>
      <p>
        可以从项目复盘、部署笔记、前后端问题排查、学习路线和工具链配置开始。每篇文章只解决一个问题，越具体越有价值。
      </p>
